[project]
name = "py-type-narrower"
version = "0.1.1"
description = "Analyze and narrow overly broad Python type annotations using LibCST and configurable type-checker soundness verification"
readme = "README.md"
authors = [
    { name = "Didier Marin", email = "mail@didiermarin.com" },
]
requires-python = ">=3.11"
dependencies = [
    "libcst>=1.5.0",
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["typing", "type-checking", "linter", "refactoring", "libcst", "literal", "narrowing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/didmar/py-type-narrower"
Repository = "https://github.com/didmar/py-type-narrower"
Issues = "https://github.com/didmar/py-type-narrower/issues"

[project.scripts]
py-type-narrower = "py_type_narrower.cli:main"

[project.entry-points."flake8.extension"]
NT = "py_type_narrower.flake8_plugin:TypeNarrowerChecker"

[project.optional-dependencies]
flake8 = ["flake8>=6.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Rules that conflict with the ruff formatter
    "W191",
    "E111",
    "E114",
    "E117",
    "D206",
    "D300",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "Q004",
    "COM812",
    "COM819",
    "ISC002",
    "E501",
    # Rules that are incompatible with each other
    "D203",
    "D213",
    # Copyright header not required
    "CPY001",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/*" = ["INP001"]
"tests/*" = ["B011", "PLR2004", "S101", "D100", "D103", "ANN"]

[tool.ty.environment]
python-version = "3.11"

[tool.hatch.build.targets.wheel]
packages = ["py_type_narrower"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=py_type_narrower --cov-report=term-missing"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "flake8>=6.0",
    "flake8-stepdown>=0.1.2; python_version >= '3.12'",
    "hypothesis>=6.170.17",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.0",
    "ty>=0.0.23",
]
